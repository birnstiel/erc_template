# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy README to index.md
        run: cp README.md index.md
      - name: Write _config.yml with remote theme
        run: |
          cat > _config.yml << 'EOF'
          title: ${GITHUB_REPOSITORY}
          description: "${{ github.repository }} – generated from README"
          # Use any official Pages theme, e.g. minimal, slate, hacker, cayman, etc.
          remote_theme: pages-themes/minimal@v0.2.0
          plugins:
            - jekyll-remote-theme
            - jekyll-seo-tag
          # Optional (uncomment if you need precise URLs for assets/links):
          # url: https://${{ github.repository_owner }}.github.io
          # baseurl: /${{ github.event.repository.name }}
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
